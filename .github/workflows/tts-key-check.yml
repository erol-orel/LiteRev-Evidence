name: TTS key check (temporary)

# Temporary: says where the narration key of the demo video is stored (which name, as a
# repository secret or variable, or in the "production" environment), by presence only,
# never a value. Removed before this pull request is merged.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tts-key-check.yml"

permissions:
  contents: read

jobs:
  repository:
    name: Repository secrets and variables
    runs-on: ubuntu-latest
    steps:
      - name: Which names hold a value (true or false only)
        env:
          S_DEMO_TTS_API_KEY: ${{ secrets.DEMO_TTS_API_KEY != '' }}
          S_DEMO_TTS_KEY: ${{ secrets.DEMO_TTS_KEY != '' }}
          S_TTS_API_KEY: ${{ secrets.TTS_API_KEY != '' }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          S_OPENAI_KEY: ${{ secrets.OPENAI_KEY != '' }}
          S_OPENAI_TTS_API_KEY: ${{ secrets.OPENAI_TTS_API_KEY != '' }}
          V_DEMO_TTS_API_KEY: ${{ vars.DEMO_TTS_API_KEY != '' }}
          V_TTS_API_KEY: ${{ vars.TTS_API_KEY != '' }}
          V_OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY != '' }}
        run: env | grep -E '^[SV]_' | sort

  production:
    name: Environment "production"
    runs-on: ubuntu-latest
    # Its secrets, without recording a deployment to production.
    environment:
      name: production
      deployment: false
    steps:
      - name: Which names hold a value (true or false only)
        env:
          S_DEMO_TTS_API_KEY: ${{ secrets.DEMO_TTS_API_KEY != '' }}
          S_DEMO_TTS_KEY: ${{ secrets.DEMO_TTS_KEY != '' }}
          S_TTS_API_KEY: ${{ secrets.TTS_API_KEY != '' }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          S_OPENAI_KEY: ${{ secrets.OPENAI_KEY != '' }}
          S_OPENAI_TTS_API_KEY: ${{ secrets.OPENAI_TTS_API_KEY != '' }}
          V_DEMO_TTS_API_KEY: ${{ vars.DEMO_TTS_API_KEY != '' }}
          V_TTS_API_KEY: ${{ vars.TTS_API_KEY != '' }}
          V_OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY != '' }}
        run: env | grep -E '^[SV]_' | sort
