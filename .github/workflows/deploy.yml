name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build & checks
    runs-on: ubuntu-latest
    services:
      # Plain Postgres for the integration tests (they use a minimal schema, no
      # pgvector needed). The suite auto-skips DB tests if this is unreachable.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python syntax check (backend + scripts + tools)
        run: python -m compileall -q *.py scripts/*.py tools/*.py

      - name: Validate requirements.txt is resolvable
        run: pip install --dry-run -r requirements.txt

      - name: Backend tests (pytest)
        env:
          # main.py imports the heavy ML libs lazily, so most tests only need the
          # import-critical subset. We ALSO install the CORE ML wheels (numpy/pandas/
          # scikit-learn/scipy/optuna/joblib — fast, unlike prophet/umap/cmdstanpy) so
          # tests/test_model_trainer.py actually runs (real training correctness).
          # Integration tests use the Postgres service above; pure tests need no DB.
          DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          WRITE_API_KEY: test-write-key
          OPENAI_API_KEY: ""
        run: |
          # httpx : requis par starlette.testclient (fastapi.testclient.TestClient).
          #   Sans lui, TOUT test passant par TestClient échoue au setup avec
          #   « requires the httpx2 package » — invisible en local, où httpx est souvent
          #   déjà installé.
          # openpyxl : dépendance d'exécution (requirements.txt) de l'export Excel. Sans
          #   elle, tests/test_model_export.py se SAUTE entièrement via importorskip et
          #   la CI passait au vert sans jamais exécuter le code d'export.
          pip install pytest fastapi pydantic "sqlalchemy>=2.0" python-dotenv python-multipart "psycopg[binary]" \
            httpx openpyxl \
            numpy pandas scikit-learn scipy optuna joblib lightgbm xgboost statsmodels
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH (runs deploy.sh on the server)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ServerAliveInterval : deploy.sh construit le frontend SUR LE SERVEUR (npm ci +
          # tsc + vite), soit plusieurs minutes SANS UNE SEULE LIGNE de sortie. Sans
          # sonde applicative, un équipement intermédiaire (NAT/pare-feu) coupe la
          # connexion inactive et ssh meurt sur « client_loop: send disconnect: Broken
          # pipe » (code 255) — constaté sur le déploiement de bfaf4fc, tué à 4 min 50 en
          # plein [5/7] Build frontend. Le déploiement s'arrête alors AVANT la bascule du
          # frontend et AVANT le redémarrage de l'API : rien de cassé, mais rien de
          # déployé non plus, et l'échec ressemble à une erreur de build.
          # 30 s x 20 = 10 min de silence tolérées, en gardant le lien actif.
          # ConnectTimeout ne couvre QUE l'établissement de la connexion, pas sa durée.
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -i ~/.ssh/deploy_key \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /opt/literev-api && git reset --hard HEAD && bash deploy.sh'

      - name: Smoke test (health + corpus stats)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Mêmes sondes que l'étape de déploiement : ce smoke test est court, mais il
          # suit un redémarrage d'API et ne doit pas échouer sur un lien coupé.
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -i ~/.ssh/deploy_key \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              bash << 'EOF'
            set -e
            # Réponse affichée EN ENTIER dans le log : un échec ici doit être
            # diagnosticable sans rouvrir une session SSH.
            curl -fsS http://localhost:8000/health -o /tmp/literev_health.json
            cat /tmp/literev_health.json; echo
            # Vérifie status + database + schema.ok. `schema.ok` est BLOQUANT depuis que
            # la production a été confirmée saine (39759fe). Il attrape ce que
            # `grep '"status":"ok"'` ne voyait pas : le DDL de démarrage échoue OUVERT,
            # donc une base à laquelle il manque une table répond « ok » pendant que
            # /corpus/fulltext-stats — la ligne suivante — renvoie 500.
            # La logique vit dans le dépôt (et est testée) plutôt qu'ici : cf.
            # scripts/check_health.py et tests/test_check_health.py.
            python3 /opt/literev-api/scripts/check_health.py /tmp/literev_health.json
            # DB + app OK : GET qui interroge la base. Remplace l'ancien POST /search
            # (endpoint retiré). -f fait échouer le smoke test sur tout statut != 2xx.
            curl -fsS http://localhost:8000/corpus/fulltext-stats >/dev/null
            echo "Smoke test passed"
          EOF
